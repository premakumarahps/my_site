  <text x="400" y="380" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#94a3b8">Wi-Fi Telemetry • Servo Micro-Dispensing • Real-Time Cloud Sync</text>
